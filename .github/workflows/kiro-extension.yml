name: Kiro extension

# The floating mascot is a native binary, so a VSIX is only valid on the platform
# it was compiled for. Each target therefore builds, tests, packages and publishes
# entirely on its own: a slow or broken platform never holds up a healthy one.

on:
  # Pushes are limited to the default branch and release tags. Without that, a
  # push to a branch with an open PR fires both `push` and `pull_request` and
  # every commit runs the whole matrix twice.
  push:
    branches: [main, master]
    tags: ['kiro-extension-v*']
    paths:
      - 'kiro-extension/**'
      - 'src/renderer/core/**'
      - '.github/workflows/kiro-extension.yml'
  pull_request:
    paths:
      - 'kiro-extension/**'
      - 'src/renderer/core/**'
      - '.github/workflows/kiro-extension.yml'
  workflow_dispatch:

# Supersede in-flight runs for the same ref, but never cancel a release.
concurrency:
  group: kiro-extension-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  release:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # A hung runner should fail loudly rather than block the queue for hours.
    timeout-minutes: 40
    # Needed to attach the VSIX to a GitHub Release. Everything else is read-only.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          # Cross-compiled from the arm64 runner. Building this on macos-13
          # instead means waiting on a deprecated, frequently queued image.
          - os: macos-14
            target: darwin-x64
            rustTarget: x86_64-apple-darwin
          - os: windows-latest
            target: win32-x64
          - os: ubuntu-22.04
            target: linux-x64

    env:
      DORAEMON_VSIX_TARGET: ${{ matrix.target }}
      DORAEMON_RUST_TARGET: ${{ matrix.rustTarget }}

    defaults:
      run:
        working-directory: kiro-extension

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kiro-extension/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTarget }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kiro-extension/companion
          key: ${{ matrix.target }}

      # tao and wry render through the system webview, which on Linux means GTK
      # and WebKitGTK headers must be present at build time.
      - name: Install Linux webview dependencies
        if: matrix.target == 'linux-x64'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - run: npm ci

      # Also asserts no dependency is borrowed from the parent project, which is
      # invisible locally and fatal here.
      - name: Typecheck
        run: npm run typecheck

      # Bundles the JS, compiles the companion into bin/<target>/, then checks
      # every sprite frame exists and every sprite set is reachable.
      - name: Build
        run: npm run build

      - name: Host checks
        run: npm run smoke

      - name: Package
        run: node scripts/release.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: kiro-extension/release/*.vsix
          if-no-files-found: error

      # The bare binary is uploaded separately so the universal job can assemble
      # one VSIX carrying every platform.
      - uses: actions/upload-artifact@v4
        with:
          name: companion-${{ matrix.target }}
          path: kiro-extension/bin/${{ matrix.target }}/*
          if-no-files-found: error

      # A workflow artifact expires and needs a GitHub login to fetch. A Release
      # asset is a permanent public download, which is what someone installing by
      # hand actually needs. Created as a draft so a half-finished matrix is never
      # public; the universal job publishes it once every platform has landed.
      - name: Attach ${{ matrix.target }} to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/kiro-extension-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"

          # Quoted heredoc: no expansion, so backticks in the markdown are safe.
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          Install in Kiro with `Extensions: Install from VSIX...`, or from the
          Open VSX marketplace if you would rather it auto-update.

          | file | for |
          | --- | --- |
          | `*-darwin-arm64.vsix` | Apple Silicon Mac |
          | `*-darwin-x64.vsix` | Intel Mac |
          | `*-win32-x64.vsix` | Windows |
          | `*-linux-x64.vsix` | Linux |
          | `*-universal.vsix` | any of the above, if you are unsure |

          The mascot is a native binary, so a platform-specific file is refused
          outright by a host it was not built for. When in doubt take the
          universal one: it carries every platform's binary in a single file.

          macOS marks downloaded binaries as quarantined, which stops the mascot
          before it starts. The extension detects this and offers to clear the
          flag for its own binary only, with your consent, the first time you
          enable desktop mode.
          NOTES

          # All four jobs race to create the same release. Losing that race is
          # the expected outcome for three of them, so it must not fail the build.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --draft \
            --title "Doraemon for Kiro ${TAG#kiro-extension-v}" \
            --notes-file "$RUNNER_TEMP/notes.md" || true

          # The job that won the race may not be visible to the others instantly.
          for _ in 1 2 3 4 5; do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 3
          done

          gh release upload "$TAG" release/*.vsix --clobber

  # Uploading to the registry is an HTTP request, not a build, so it does not need
  # the platform it targets. Splitting it out buys two things. The secret can live
  # under a GitHub environment, which is only readable by a job declaring
  # `environment:`, and no half-published version is possible: Open VSX treats a
  # version as immutable, so if one platform failed to build after another had
  # already published, that gap could never be filled, only superseded by a
  # higher version.
  publish:
    name: publish ${{ matrix.target }}
    needs: release
    if: startsWith(github.ref, 'refs/tags/kiro-extension-v')
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    # Only needs to read back the build artifact. Stated explicitly so a
    # restrictive repository default cannot fail the download confusingly.
    permissions:
      contents: read
      actions: read

    # Reads OVSX_PAT from an environment secret. Defaults to an environment named
    # `open-vsx`; set an OVSX_ENVIRONMENT repository variable to point elsewhere.
    environment: ${{ vars.OVSX_ENVIRONMENT || 'open-vsx' }}

    strategy:
      # One platform failing to upload must not strand the others.
      fail-fast: false
      matrix:
        target: [darwin-arm64, darwin-x64, win32-x64, linux-x64]

    defaults:
      run:
        working-directory: kiro-extension

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: kiro-extension/release

      - name: Publish ${{ matrix.target }} to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: node scripts/publish.mjs --target=${{ matrix.target }}

  # A platform-specific VSIX declares TargetPlatform, and a mismatched host
  # refuses to install it. This produces one file with every companion binary and
  # no TargetPlatform, for sharing a direct download rather than using a registry.
  universal:
    name: universal
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write

    defaults:
      run:
        working-directory: kiro-extension

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kiro-extension/package-lock.json

      - name: Collect every platform's companion
        uses: actions/download-artifact@v4
        with:
          pattern: companion-*
          path: staged

      - name: Stage binaries into bin/
        working-directory: .
        run: |
          set -euo pipefail
          for dir in staged/companion-*; do
            target="$(basename "$dir" | sed 's/^companion-//')"
            mkdir -p "kiro-extension/bin/$target"
            cp "$dir"/* "kiro-extension/bin/$target/"
            # upload-artifact does not preserve the executable bit.
            chmod +x "kiro-extension/bin/$target"/*
            echo "staged $target"
          done
          ls -R kiro-extension/bin

      - run: npm ci

      # Skips the native cargo build so the downloaded binaries are not replaced.
      - name: Package universal VSIX
        env:
          DORAEMON_SKIP_COMPANION: '1'
        run: |
          npm run build
          node scripts/release.mjs --universal

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-universal
          path: kiro-extension/release/*universal.vsix
          if-no-files-found: error

      # This job only runs once all four platforms succeeded, so reaching here is
      # the signal that the release is complete. Publishing the draft is therefore
      # the last step: if any platform had failed, the release stays a draft,
      # visible to maintainers and not to users.
      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/kiro-extension-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          gh release upload "$TAG" release/*universal.vsix --clobber
          gh release edit "$TAG" --draft=false --latest
          echo "released: $(gh release view "$TAG" --json url --jq .url)"
