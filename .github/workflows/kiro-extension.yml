name: Kiro extension

# The floating mascot is a native binary, so a VSIX is only valid on the platform
# it was compiled for. Each target therefore builds, tests, packages and publishes
# entirely on its own: a slow or broken platform never holds up a healthy one.

on:
  # Pushes are limited to the default branch and release tags. Without that, a
  # push to a branch with an open PR fires both `push` and `pull_request` and
  # every commit runs the whole matrix twice.
  push:
    branches: [main, master]
    tags: ['kiro-extension-v*']
    paths:
      - 'kiro-extension/**'
      - 'src/renderer/core/**'
      - '.github/workflows/kiro-extension.yml'
  pull_request:
    paths:
      - 'kiro-extension/**'
      - 'src/renderer/core/**'
      - '.github/workflows/kiro-extension.yml'
  workflow_dispatch:

# Supersede in-flight runs for the same ref, but never cancel a release.
concurrency:
  group: kiro-extension-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  release:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # A hung runner should fail loudly rather than block the queue for hours.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          # Cross-compiled from the arm64 runner. Building this on macos-13
          # instead means waiting on a deprecated, frequently queued image.
          - os: macos-14
            target: darwin-x64
            rustTarget: x86_64-apple-darwin
          - os: windows-latest
            target: win32-x64
          - os: ubuntu-22.04
            target: linux-x64

    env:
      DORAEMON_VSIX_TARGET: ${{ matrix.target }}
      DORAEMON_RUST_TARGET: ${{ matrix.rustTarget }}

    defaults:
      run:
        working-directory: kiro-extension

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kiro-extension/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTarget }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kiro-extension/companion
          key: ${{ matrix.target }}

      # tao and wry render through the system webview, which on Linux means GTK
      # and WebKitGTK headers must be present at build time.
      - name: Install Linux webview dependencies
        if: matrix.target == 'linux-x64'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - run: npm ci

      # Also asserts no dependency is borrowed from the parent project, which is
      # invisible locally and fatal here.
      - name: Typecheck
        run: npm run typecheck

      # Bundles the JS, compiles the companion into bin/<target>/, then checks
      # every sprite frame exists and every sprite set is reachable.
      - name: Build
        run: npm run build

      - name: Host checks
        run: npm run smoke

      - name: Package
        run: node scripts/release.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: kiro-extension/release/*.vsix
          if-no-files-found: error

      # The bare binary is uploaded separately so the universal job can assemble
      # one VSIX carrying every platform.
      - uses: actions/upload-artifact@v4
        with:
          name: companion-${{ matrix.target }}
          path: kiro-extension/bin/${{ matrix.target }}/*
          if-no-files-found: error

      # Publishes the moment THIS platform is ready, without waiting for the
      # others. Only ever runs from a release tag.
      - name: Publish ${{ matrix.target }} to Open VSX
        if: startsWith(github.ref, 'refs/tags/kiro-extension-v')
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        shell: bash
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT secret is not set; add it in repository settings." >&2
            exit 1
          fi
          node scripts/release.mjs --publish

  # A platform-specific VSIX declares TargetPlatform, and a mismatched host
  # refuses to install it. This produces one file with every companion binary and
  # no TargetPlatform, for sharing a direct download rather than using a registry.
  universal:
    name: universal
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: kiro-extension

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kiro-extension/package-lock.json

      - name: Collect every platform's companion
        uses: actions/download-artifact@v4
        with:
          pattern: companion-*
          path: staged

      - name: Stage binaries into bin/
        working-directory: .
        run: |
          set -euo pipefail
          for dir in staged/companion-*; do
            target="$(basename "$dir" | sed 's/^companion-//')"
            mkdir -p "kiro-extension/bin/$target"
            cp "$dir"/* "kiro-extension/bin/$target/"
            # upload-artifact does not preserve the executable bit.
            chmod +x "kiro-extension/bin/$target"/*
            echo "staged $target"
          done
          ls -R kiro-extension/bin

      - run: npm ci

      # Skips the native cargo build so the downloaded binaries are not replaced.
      - name: Package universal VSIX
        env:
          DORAEMON_SKIP_COMPANION: '1'
        run: |
          npm run build
          node scripts/release.mjs --universal

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-universal
          path: kiro-extension/release/*universal.vsix
          if-no-files-found: error
