[package]
name = "doraemon-companion"
version = "0.1.2"
edition = "2021"
description = "Floating Doraemon mascot window driven by the Kiro extension"
license = "MIT"

[dependencies]
tao = "=0.35.3"
# The `transparent` feature is what actually lets the webview stop painting a
# background on macOS. Without it the window is transparent but the web content
# renders opaque white on top of it.
wry = { version = "=0.55.1", features = ["transparent"] }
serde_json = "=1.0.151"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.180"

# Window probes, so the mascot can walk on other apps' windows. Each crate is
# already in the lockfile through tao and wry, so none of them adds a download.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "=0.8.7"
core-graphics = "=0.25.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "=2.21.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
