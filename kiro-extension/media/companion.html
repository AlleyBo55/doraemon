<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Doraemon</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      /* The window itself is the mascot, so nothing here should be selectable. */
      user-select: none;
      -webkit-user-select: none;
    }

    #sprite {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 128px;
      height: 128px;
      margin-left: -64px;
      cursor: grab;
      -webkit-user-drag: none;
    }

    #sprite:active { cursor: grabbing; }

    /*
     * Anchored just above the sprite rather than to the top of the window, so
     * short thoughts sit right on Doraemon's head instead of floating away.
     * Growing upward from `bottom` keeps that gap constant as text wraps.
     */
    .bubble {
      position: absolute;
      bottom: 134px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 16px);
      padding: 7px 11px;
      border-radius: 13px;
      background: rgba(28, 28, 32, 0.94);
      color: #f2f2f5;
      font-size: 12px;
      line-height: 1.35;
      text-align: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      cursor: pointer;
      transition: background 120ms ease;
    }

    .bubble:hover {
      background: rgba(44, 44, 50, 0.96);
    }

    /* Small tail pointing down at the sprite. */
    .bubble::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 50%;
      margin-left: -5px;
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-top: 6px solid rgba(28, 28, 32, 0.94);
    }

    .bubble[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="bubble" class="bubble" hidden></div>
  <img id="sprite" alt="" draggable="false" />
  <script src="dora://localhost/companion.js"></script>
</body>
</html>
