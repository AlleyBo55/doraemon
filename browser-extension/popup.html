<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #fafafa;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .header img {
      width: 40px;
      height: 40px;
    }
    .header h1 {
      font-size: 16px;
      margin: 0;
      color: #1e293b;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: white;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      margin-bottom: 12px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .status-dot.connected { background: #22c55e; }
    .status-dot.disconnected { background: #ef4444; }
    .status-text {
      font-size: 14px;
      color: #64748b;
    }
    .sites {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 12px;
    }
    .sites strong {
      color: #64748b;
      display: block;
      margin-bottom: 4px;
    }
    .test-btn {
      width: 100%;
      padding: 10px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .test-btn:hover {
      background: #2563eb;
    }
    .test-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .test-result {
      font-size: 12px;
      color: #22c55e;
      text-align: center;
      min-height: 16px;
    }
    .test-result.error {
      color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Doraemon">
    <h1>Doraemon Notifications</h1>
  </div>
  
  <div class="status">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">Checking...</span>
  </div>
  
  <div class="sites">
    <strong>Monitoring:</strong>
    🐦 Twitter/X &nbsp; 📧 Outlook &nbsp; 💬 Teams &nbsp; 🐙 GitHub
  </div>
  
  <button class="test-btn" id="testBtn">🧪 Send Test Notification</button>
  <div class="test-result" id="testResult"></div>
  
  <script src="popup.js"></script>
</body>
</html>
